# Generated by simpright apply from simpright.yml: change simpright.yml, then run simpright apply.
name: Playwright Run (reusable)

# Shared job for all test workflows: runs one Playwright project (or all of them) and publishes
# the report to GitHub Pages (gh-pages branch) under the given report family. The steps are the
# SimpRight Kit's actions (setup, run-tests, publish-run).

on:
  workflow_call:
    inputs:
      project:
        description: 'Playwright project: ui, api, or all (both in one run, e.g. the smoke set)'
        required: true
        type: string
      family:
        description: 'Report family folder on GitHub Pages, e.g. ui-regression'
        required: true
        type: string
      paths:
        description: 'Spec folders or files to run (empty = the whole project)'
        required: false
        type: string
        default: ''
      grep:
        description: 'Only run tests whose title matches (e.g. a scenario ID)'
        required: false
        type: string
        default: ''
      publish-latest-coverage:
        description: 'Publish this run''s API coverage as latest/api-coverage'
        required: false
        type: boolean
        default: false
      keep-runs:
        description: 'How many runs of the family stay on GitHub Pages; older ones are removed when this run is published'
        required: false
        type: number
        default: 10
    # Only the secrets the tests read; callers pass them by name instead of `secrets: inherit`.
    secrets:
      SHOP_USER:
        required: true
      SHOP_PASSWORD:
        required: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write # push to gh-pages
      packages: read # install the optional coverage package

    env:
      # The tests read the secrets from the environment (no .env file on CI).
      SHOP_USER: ${{ secrets.SHOP_USER }}
      SHOP_PASSWORD: ${{ secrets.SHOP_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@cccccccccccccccccccccccccccccccccccccccc # v7.0.1
        with:
          # No token in the git config while dependencies install and tests run; only the publish step gets one.
          persist-credentials: false

      - name: Set up Node.js and install
        uses: Zaytsman/SimpRightKit/actions/setup@bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb # v9.9.9
        with:
          node-version: 24
          # Lets npm ci install the optional private coverage package with the token below.
          registry-url: https://npm.pkg.github.com
          scope: '@acme'
          # Read access to the private coverage package (granted to this repo in the package settings).
          # Without access (e.g. in a fork) the optional package is skipped and the tests run without coverage.
          registry-token: ${{ secrets.GITHUB_TOKEN }}
          browsers: ${{ inputs.project != 'api' && 'chromium' || '' }}

      - name: Typecheck
        run: npm run typecheck

      # The tests, then the step-title check (warnings only). A test failure doesn't stop the job here,
      # so the report is still published; the last step fails the job.
      - name: Run tests
        id: tests
        continue-on-error: true
        uses: Zaytsman/SimpRightKit/actions/run-tests@bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb # v9.9.9
        with:
          project: ${{ inputs.project }}
          paths: ${{ inputs.paths }}
          grep: ${{ inputs.grep }}
          check-step-titles: true

      - name: Publish report to GitHub Pages
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        uses: Zaytsman/SimpRightKit/actions/publish-run@bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb # v9.9.9
        with:
          run-id: ${{ inputs.family }}
          keep: ${{ inputs.keep-runs }}
          latest-coverage: ${{ inputs.publish-latest-coverage }}
          # The push credential for gh-pages; the checkout kept none.
          token: ${{ github.token }}

      - name: Upload report artifact
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa # v7.0.2
        with:
          name: ${{ inputs.family }}-run-${{ github.run_number }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      - name: Fail the job if tests failed
        if: steps.tests.outcome == 'failure'
        env:
          FAMILY: ${{ inputs.family }}
        run: |
          echo "::error::Tests failed. Report: https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/${FAMILY}/run-${GITHUB_RUN_NUMBER}/"
          exit 1
