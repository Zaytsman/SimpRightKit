# Generated by simpright apply from simpright.yml: change simpright.yml, then run simpright apply.
name: API regression test run

on:
  workflow_dispatch:
  schedule:
    # GitHub schedules run in UTC: 02:15 UTC on weekdays.
    - cron: '15 2 * * 1-5'

permissions:
  contents: write
  packages: read

jobs:
  tests:
    uses: ./.github/workflows/playwright-run.yml
    secrets:
      SHOP_USER: ${{ secrets.SHOP_USER }}
      SHOP_PASSWORD: ${{ secrets.SHOP_PASSWORD }}
    with:
      project: api
      family: api-regression
      # The run's coverage represents the whole suite; it's published as the latest.
      publish-latest-coverage: true
