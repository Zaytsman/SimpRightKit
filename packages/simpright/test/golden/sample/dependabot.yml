# Generated by simpright apply from simpright.yml: change simpright.yml, then run simpright apply.
version: 2

multi-ecosystem-groups:
  # The SimpRight Kit is one release: its npm packages and its actions move in one PR (simpright doctor checks that
  # they agree). The two updates that join this group take only the kit; the others ignore it.
  simpright-kit:
    schedule:
      interval: "weekly"
      day: "tuesday"
    commit-message:
      prefix: "deps"

updates:
  - package-ecosystem: "npm"
    directory: "/"
    multi-ecosystem-group: "simpright-kit"
    patterns:
      - "simpright"
      - "@simpright/*"
    # A new version is proposed only after 7 days, so a hijacked release has time to be caught and pulled.
    cooldown:
      default-days: 7

  - package-ecosystem: "github-actions"
    directory: "/"
    multi-ecosystem-group: "simpright-kit"
    patterns:
      - "Zaytsman/SimpRightKit*"
    cooldown:
      default-days: 7

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
    # A new version is proposed only after 7 days, so a hijacked release has time to be caught and pulled.
    # Security updates are not delayed.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    ignore:
      # The simpright-kit group updates these.
      - dependency-name: "simpright"
      - dependency-name: "@simpright/*"
    groups:
      # One PR for all minor/patch bumps; major versions get their own PR.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
    cooldown:
      default-days: 7
    ignore:
      # The simpright-kit group updates the kit's actions.
      - dependency-name: "Zaytsman/SimpRightKit*"
    # The actions are pinned to commit SHAs with the version in a comment; Dependabot updates both.
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
