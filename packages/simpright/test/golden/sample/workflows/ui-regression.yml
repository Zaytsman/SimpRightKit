# Generated by simpright apply from simpright.yml: change simpright.yml, then run simpright apply.
name: UI regression test run

on:
  workflow_dispatch:
  schedule:
    # GitHub schedules run in UTC: 06:15 UTC on weekdays.
    - cron: '15 6 * * 1-5'

permissions:
  contents: write

jobs:
  tests:
    uses: ./.github/workflows/playwright-run.yml
    secrets:
      SHOP_USER: ${{ secrets.SHOP_USER }}
      SHOP_PASSWORD: ${{ secrets.SHOP_PASSWORD }}
    with:
      project: ui
      family: ui-regression
