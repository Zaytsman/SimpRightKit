# Generated by simpright apply from simpright.yml: change simpright.yml, then run simpright apply.
name: PR Checks

# Required status check for pull requests (the `verify` job: a branch ruleset can require it).
# Static checks only: typecheck, scenario validation, the project's setup and the build of the portal's pages.
# The tests run in the test workflows, not here.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@cccccccccccccccccccccccccccccccccccccccc # v7.0.1
        with:
          # No token in the git config: the checks only read.
          persist-credentials: false

      - name: Set up Node.js and install
        uses: Zaytsman/SimpRightKit/actions/setup@bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb # v9.9.9
        with:
          node-version: 24

      - name: Typecheck
        run: npm run typecheck

      - name: Validate scenarios
        run: npx simpright-scenarios validate

      # simpright.yml, the runs against their workflows, the generated files, the kit's actions and the core boundary;
      # with a template version in simpright.yml, also the core files against SimpRightTemplate (read from GitHub,
      # no token).
      - name: Check the project's setup
        run: npx --no-install simpright doctor

      # The portal's pages and the dashboard's portal.json are published from main by the same command
      # (publish-test-cases.yml); check that they still build.
      - name: Build the portal's pages
        run: npx --no-install simpright-portal build-pages --site test-results/site
