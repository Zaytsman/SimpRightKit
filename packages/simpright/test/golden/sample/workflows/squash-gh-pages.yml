# Generated by simpright apply from simpright.yml: change simpright.yml, then run simpright apply.
name: Squash GitHub Pages History

# Replaces the gh-pages branch's history with one commit of the current site (the squash-pages action).
# Each publish adds a full report to the history, so without this the branch grows forever even though
# the site keeps only the latest runs. The site itself doesn't change. Monthly, and by hand.

on:
  workflow_dispatch:
  schedule:
    # 04:45 UTC on the 1st of each month, never on the hour.
    - cron: '45 4 1 * *'

permissions:
  contents: write # force-push gh-pages

concurrency:
  group: squash-gh-pages
  cancel-in-progress: false

jobs:
  squash:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@cccccccccccccccccccccccccccccccccccccccc # v7.0.1
        with:
          # Only the squash step gets a token.
          persist-credentials: false

      - name: Squash gh-pages
        uses: Zaytsman/SimpRightKit/actions/squash-pages@bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb # v9.9.9
        with:
          token: ${{ github.token }}
