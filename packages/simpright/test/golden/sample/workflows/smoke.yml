name: Smoke test run

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    uses: ./.github/workflows/playwright-run.yml
    secrets:
      SHOP_USER: ${{ secrets.SHOP_USER }}
      SHOP_PASSWORD: ${{ secrets.SHOP_PASSWORD }}
    with:
      project: all
      family: smoke
      grep: '@smoke'
