# Generated by simpright apply from simpright.yml: change simpright.yml, then run simpright apply.
name: Publish Test Cases

# Rebuilds the portal's pages on GitHub Pages (the Test Cases pages, the Bugs page and the dashboard with its
# portal.json) whenever the scenarios, the bugs, simpright.yml or the kit's version (package-lock.json) change on
# main, so they show the merged code; the test runs publish their own reports. Can also be run by hand.

on:
  push:
    branches: [main]
    paths:
      - 'test-scenarios/**'
      - 'bugs/**'
      - 'simpright.yml'
      - 'package-lock.json'
      - '.github/workflows/publish-test-cases.yml'
  workflow_dispatch:

permissions:
  contents: write # push to gh-pages

concurrency:
  group: publish-test-cases
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@cccccccccccccccccccccccccccccccccccccccc # v7.0.1
        with:
          # No token in the git config while dependencies install; only the publish step gets one.
          persist-credentials: false

      # The kit's packages (the validator, the pages and their builder); optional packages aren't needed.
      - name: Set up Node.js and install
        uses: Zaytsman/SimpRightKit/actions/setup@bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb # v9.9.9
        with:
          node-version: 24
          omit-optional: true

      - name: Validate scenarios
        run: npx simpright-scenarios validate

      - name: Build and publish
        uses: Zaytsman/SimpRightKit/actions/publish-pages@bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb # v9.9.9
        with:
          # The push credential for gh-pages; the checkout kept none.
          token: ${{ github.token }}
