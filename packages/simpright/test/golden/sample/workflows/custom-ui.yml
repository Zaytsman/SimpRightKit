# Generated by simpright apply from simpright.yml: change simpright.yml, then run simpright apply.
name: Custom UI test run

on:
  workflow_dispatch:
    inputs:
      area:
        description: 'UI area to run (a folder in tests/ui)'
        required: true
        default: 'all'
        type: choice
        # The folders in tests/ui: simpright apply writes them, and simpright doctor checks them.
        options:
          - all
          - cart
          - products
      grep:
        description: 'Optional: only tests whose title matches, e.g. UI-001'
        required: false
        type: string
        default: ''
      keep-runs:
        description: 'Custom UI runs to keep on GitHub Pages (older ones are removed)'
        required: false
        type: number
        default: 5

permissions:
  contents: write

jobs:
  tests:
    uses: ./.github/workflows/playwright-run.yml
    secrets:
      SHOP_USER: ${{ secrets.SHOP_USER }}
      SHOP_PASSWORD: ${{ secrets.SHOP_PASSWORD }}
    with:
      project: ui
      family: custom-ui
      paths: ${{ inputs.area != 'all' && format('tests/ui/{0}/', inputs.area) || '' }}
      grep: ${{ inputs.grep }}
      # A manual run's number input arrives as a string; playwright-run.yml's keep-runs is a number.
      keep-runs: ${{ fromJSON(inputs.keep-runs) }}
