name: Update screenshots

# Writes new Linux baselines for the portal's screenshot tests (CI compares with these) and uploads them as an
# artifact; commit them from there. Run it by hand after a change to the pages or the sample.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Write the baselines
        run: npm run test:screenshots -- --update-snapshots=all

      - name: Upload the baselines
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshot-baselines
          path: packages/portal/screenshots/baselines/*-linux.png
          if-no-files-found: error
          retention-days: 7
