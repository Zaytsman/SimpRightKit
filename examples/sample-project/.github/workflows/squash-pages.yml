name: Squash Pages

on:
  schedule:
    - cron: '45 4 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  squash:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Squash gh-pages
        uses: ./.github/actions/squash-pages
        with:
          token: ${{ github.token }}
